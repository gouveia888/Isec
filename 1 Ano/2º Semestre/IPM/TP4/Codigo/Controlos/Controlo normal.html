<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Controle por Clique</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      margin: 0;
    }
    .btn-container {
      margin-top: 40px;
    }
    button {
      font-size: 24px;
      margin: 10px;
      padding: 20px 40px;
    }
    #log {
      margin-top: 40px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h2>Controle por Clique</h2>

  <div class="btn-container">    
    <button onclick="sendCommand('esquerda')">Esquerda</button>
    <button onclick="sendCommand('frente')">Frente</button>
    <button onclick="sendCommand('direita')">Direita</button>    
    <button onclick="sendCommand('parar')">Parar</button>
  </div>

  <div id="log">Aguardando clique...</div>

  <script>
    const targetIP = '192.168.99.130'; // IP do ESP32
    const log = document.getElementById("log");

    function sendCommand(command) {
      log.innerText = `Comando enviado: ${command} (clique)`;
      fetch(`http://${targetIP}/comando?command=${command}`)
        .then(response => response.text())
        .then(data => console.log(data))
        .catch(err => log.innerText = `Erro: ${err}`);
    }
  </script>
</body>
</html>
