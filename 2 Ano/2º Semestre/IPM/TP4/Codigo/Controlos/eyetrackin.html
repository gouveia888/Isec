<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Controle Ocular</title>
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      margin: 0;
    }
    .btn-container {
      margin-top: 40px;
    }
    button {
      font-size: 24px;
      margin: 10px;
      padding: 20px 40px;
    }
    #log {
      margin-top: 40px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h2>Controle Ocular</h2>

  <div class="btn-container">    
    <button id="btn2">Esquerda</button>
    <button id="btn1">Frente</button>
    <button id="btn3">Direita</button>    
    <button id="btn4">Parar</button>
  </div>

  <div id="log">Rastreando olhos...</div>

  <script>
    const targetIP = '192.168.99.130';
    const log = document.getElementById("log");

    webgazer.setGazeListener((data) => {
      if (!data) return;
      const gazePoint = document.elementFromPoint(data.x, data.y);

      if (gazePoint && gazePoint.tagName === "BUTTON") {
        const cmd = gazePoint.innerText.toLowerCase();
        log.innerText = `Selecionado com os olhos: ${cmd}`;
        sendCommand(cmd);
      }
    }).begin();

    webgazer.showPredictionPoints(true);

    function sendCommand(command) {
      fetch(`http://${targetIP}/comando?command=${command}`)
        .then(response => response.text())
        .then(data => console.log(data))
        .catch(err => log.innerText = `Erro: ${err}`);
    }
  </script>
</body>
</html>
